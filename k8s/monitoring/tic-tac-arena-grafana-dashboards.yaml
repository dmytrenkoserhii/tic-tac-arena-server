apiVersion: v1
kind: ConfigMap
metadata:
  name: tic-tac-arena-grafana-dashboards
  namespace: monitoring
data:
  tic-tac-arena-overview.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "grafana", "uid": "-- Grafana --" },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 0 },
          "id": 1,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "value_and_name"
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=\"tic-tac-arena\",app=\"backend\"}[5m])) * 60",
              "refId": "A"
            }
          ],
          "title": "HTTP requests / min",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "gridPos": { "h": 6, "w": 8, "x": 8, "y": 0 },
          "id": 2,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "value_and_name"
          },
          "targets": [
            {
              "expr": "sum(rate(http_5xx_errors_total{namespace=\"tic-tac-arena\",app=\"backend\"}[5m])) * 60",
              "refId": "A"
            }
          ],
          "title": "HTTP 5xx / min",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": { "defaults": { "unit": "s", "decimals": 3 }, "overrides": [] },
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 0 },
          "id": 3,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "value_and_name"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"tic-tac-arena\",app=\"backend\"}[5m])))",
              "refId": "A"
            }
          ],
          "title": "HTTP p95 latency",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "id": 4,
          "options": { "legend": { "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "single", "sort": "none" } },
          "targets": [
            {
              "expr": "sum by (method, route, status_code) (rate(http_requests_total{namespace=\"tic-tac-arena\",app=\"backend\"}[5m])) * 60",
              "legendFormat": "{{method}} {{route}} {{status_code}}",
              "refId": "A"
            }
          ],
          "title": "Traffic by route / min",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "loki", "uid": "Loki" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "id": 5,
          "options": { "dedupStrategy": "none", "enableLogDetails": true, "prettifyLogMessage": false, "showCommonLabels": false, "showLabels": false, "showTime": true, "sortOrder": "Descending", "wrapLogMessage": true },
          "targets": [
            {
              "expr": "{namespace=\"tic-tac-arena\", app=\"backend\"}",
              "refId": "A"
            }
          ],
          "title": "Backend logs",
          "type": "logs"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "style": "dark",
      "tags": ["tic-tac-arena", "backend"],
      "templating": { "list": [] },
      "time": { "from": "now-6h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "Tic Tac Arena Backend Overview",
      "uid": "tic-tac-arena-backend-overview",
      "version": 1,
      "weekStart": ""
    }
