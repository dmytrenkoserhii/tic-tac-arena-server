apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  key: admin-user
                  name: grafana-admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: admin-password
                  name: grafana-admin
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: 'false'
            - name: GF_SERVER_ROOT_URL
              value: '%(protocol)s://%(domain)s/grafana/'
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: 'true'
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi
          volumeMounts:
            - mountPath: /etc/grafana/provisioning/datasources/datasources.yml
              name: provisioning
              subPath: datasources.yml
            - mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              name: provisioning
              subPath: dashboards.yml
            - mountPath: /etc/grafana/provisioning/dashboards/tic-tac-arena-dashboards.yml
              name: tic-tac-arena-provisioning
              subPath: tic-tac-arena-dashboards.yml
            - mountPath: /var/lib/grafana/dashboards
              name: dashboards
            - mountPath: /var/lib/grafana/tic-tac-arena-dashboards
              name: tic-tac-arena-dashboards
            - mountPath: /var/lib/grafana
              name: data
      volumes:
        - name: provisioning
          configMap:
            name: grafana-provisioning
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: tic-tac-arena-provisioning
          configMap:
            name: tic-tac-arena-grafana-provisioning
        - name: tic-tac-arena-dashboards
          configMap:
            name: tic-tac-arena-grafana-dashboards
        - name: data
          emptyDir: {}
