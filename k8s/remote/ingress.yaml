apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tic-tac-arena
  namespace: tic-tac-arena
spec:
  ingressClassName: nginx
  rules:
    - host: tic-tac-arena.46.225.222.116.sslip.io
      http:
        paths:
          - path: /health
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 3000
          - path: /ready
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tic-tac-arena-api
  namespace: tic-tac-arena
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/use-regex: 'true'
spec:
  ingressClassName: nginx
  rules:
    - host: tic-tac-arena.46.225.222.116.sslip.io
      http:
        paths:
          - path: /api/?(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend
                port:
                  number: 3000
