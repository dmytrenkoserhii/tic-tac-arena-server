apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migration
  namespace: tic-tac-arena
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: backend-migration
    spec:
      restartPolicy: Never
      containers:
        - name: backend-migration
          image: tic-tac-arena-backend:local
          imagePullPolicy: IfNotPresent
          command: ['node', 'dist/scripts/run-migrations.js']
          envFrom:
            - configMapRef:
                name: tic-tac-arena-config
            - secretRef:
                name: tic-tac-arena-secrets
